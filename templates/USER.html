<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulaire d'Inscription Utilisateur</title>
<style>
/* STYLES DE BASE STRUCTURAUX (COMMUNS PC ET MOBILE) */
* { box-sizing: border-box; }
body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f9;
    margin: 0;
    padding: 20px;
}

/* Enveloppe de formulaire par défaut (Ordinateur) */
.form-container {
    display: flex;
    justify-content: flex-end; /* Alignement initial à droite sur PC */
    padding: 20px;
    width: 100%;
}
form {
    width: 300px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: #f9f9f9;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
}
h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 24px;
}
label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}

/* Calibrage des zones de texte et de saisie */
input[type="text"],
input[type="password"],
input[type="tel"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: background-color 0.2s;
}
button:hover {
    background-color: #0056b3;
}

/* Styles graphiques des alertes d'insertion Flask */
.error { color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; font-weight: bold; }
.success { color: #155724; background-color: #d4edda; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; font-weight: bold; }

/* ========================================================
   2. INFRASTRUCTURE ÉTANCHE ORDINATEURS (> 768px)
   ======================================================== */
@media screen and (min-width: 769px) {
    .form-container { display: flex !important; justify-content: flex-end !important; }
    form { width: 300px !important; }
}

/* ========================================================
   3. CONFIGURATION RESPONSIVE ÉTANCHE POUR MOBILE (<= 768px)
   ======================================================== */
@media screen and (max-width: 768px) {
    body { padding: 15px 10px !important; }
    
    /* 🚨 SÉCURISATION EXTENSIBLE : Le conteneur s'annule pour centrer le formulaire */
    .form-container {
        display: block !important;
        justify-content: center !important;
        padding: 0 !important;
        width: 100% !important;
    }
    
    /* 🚨 EMPILEMENT AUTOMATIQUE : Le formulaire prend toute la largeur du smartphone */
    form {
        width: 100% !important;
        max-width: 100% !important;
        padding: 20px 15px !important;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04) !important;
    }

    h2 { font-size: 20px !important; text-align: center !important; }

    /* 📐 RECALIBRAGE ÉLASTIQUE POUR LE CONFORT TACTILE SUR MOBILE */
    input[type="text"],
    input[type="password"],
    input[type="tel"] {
        height: 42px !important; /* Épaisseur idéale pour cliquer facilement au doigt */
        padding: 10px !important;
        font-size: 14px !important;
        margin-bottom: 12px !important;
    }

    button[type="submit"], button {
        height: 45px !important;
        font-size: 15px !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
    }

    /* Sécurité additionnelle pour les tableaux du module si intégration future */
    .table-responsive {
        width: 100% !important;
        max-width: 100% !important;
        overflow-x: auto !important;
        display: block !important;
        -webkit-overflow-scrolling: touch;
    }
}
</style>
</head>
<body>
    <p style="text-align: center; font-family: Arial, sans-serif;"><a href="https://promas.sn" target="_blank" style="color: #007bff; font-weight: bold; text-decoration: none;">Visiter PROMAS</a></p>
    
    <div class="form-container">
        <!-- Connexion du bouton de soumission à l'URL Python d'insertion -->
        <form action="/ajouter_utilisateur" method="POST">
            <h2>Créez un compte</h2>
            
            <!-- Structure Jinja aérée pour un rendu visuel optimal -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <!-- Champ Nom d'utilisateur -->
            <label for="Nom_utilisateur">Nom d'utilisateur :</label>
            <input type="text" id="Nom_utilisateur" name="NomUtilisateur" required>
            
            <!-- Champ Mot de passe -->
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="MotPasse" required>
            
            <!-- Fonction ou Poste Occupé -->
            <label for="Fonction">Fonction :</label>
            <input type="text" id="Fonction" name="Fonction" required>
            
            <!-- Adresse physique -->
            <label for="Adresse">Adresse :</label>
            <input type="text" id="Adresse" name="Adresse" required>
            
            <!-- Téléphone (Type 'tel' officiel pour le clavier numérique mobile) -->
            <label for="Téléphone">Téléphone :</label>
            <input type="tel" id="Téléphone" name="Telephone" required>
            
            <!-- Champ Code d'invitation secret -->
            <label for="Code_invitation">Code d'invitation secret :</label>
            <input type="text" id="Code_invitation" name="CodeInvitation" placeholder="Code requis pour s'inscrire" required>
            
            <button type="submit">S'inscrire</button>
        </form>
    </div>
</body>
</html>
