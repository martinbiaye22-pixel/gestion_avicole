<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion Espace PROMAS</title>
<style>
/* ========================================================
   1. STYLES STRUCTURAUX DE BASE (MODE ORDINATEUR PAR DÉFAUT)
   ======================================================== */
* { box-sizing: border-box; }
body { 
    font-family: Arial, sans-serif; 
    background-color: #f4f4f9; 
    margin: 0; 
    padding: 20px; 
}
.login-container { 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    height: 85vh; 
}
form { 
    width: 350px; /* Largeur confortable par défaut sur PC */
    padding: 25px; 
    border: 1px solid #ccc; 
    border-radius: 5px; 
    background-color: #f9f9f9; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
}
h2 { 
    margin-top: 0; 
    margin-bottom: 20px; 
    font-size: 24px; 
    text-align: center; 
}
label { 
    display: block; 
    margin-bottom: 5px; 
    font-weight: bold; 
}
input[type="text"], input[type="password"] { 
    width: 100%; 
    padding: 10px; 
    margin-bottom: 15px; 
    border: 1px solid #ccc; 
    border-radius: 4px; 
    box-sizing: border-box; 
}
button { 
    width: 100%; 
    padding: 12px; 
    background-color: #28a745; 
    color: white; 
    border: none; 
    border-radius: 4px; 
    cursor: pointer; 
    font-size: 16px; 
    font-weight: bold;
}
button:hover { 
    background-color: #218838; 
}
.error { 
    color: #721c24; 
    background-color: #f8d7da; 
    padding: 10px; 
    border-radius: 4px; 
    margin-bottom: 15px; 
    font-size: 14px; 
    text-align: center; 
}
.success { 
    color: #155724; 
    background-color: #d4edda; 
    padding: 10px; 
    border-radius: 4px; 
    margin-bottom: 15px; 
    font-size: 14px; 
    text-align: center; 
}

/* ========================================================
   2. INFRASTRUCTURE ETANCHE ORDINATEUR (> 768px)
   ======================================================== */
@media screen and (min-width: 769px) {
    form {
        width: 350px !important;
    }
}

/* ========================================================
   3. ADAPTATION AUTOMATIQUE SMARTPHONES (<= 768px)
   ======================================================== */
@media screen and (max-width: 768px) {
    body {
        padding: 15px;
    }
        /* CENTRAGE VERTICAL ET HORIZONTAL ABSOLU SUR MOBILE */
    .login-container {
        display: flex !important;
        justify-content: center !important; /* Centre horizontalement */
        align-items: center !important;     /* Centre verticalement */
        height: 88vh !important;            /* Utilise la hauteur de l'écran mobile pour le centrage */
        width: 100% !important;
        margin: 0 !important;
    }
    
    form {
        width: 100% !important;
        max-width: 100% !important;
        padding: 20px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.06) !important;
        margin: auto 0 !important;          /* Force le maintien au centre */
    }

    h2 {
        font-size: 20px !important; /* Titre adapté */
        margin-bottom: 15px;
    }
    input[type="text"], input[type="password"] {
        padding: 12px !important; /* Champs plus grands pour faciliter la saisie tactile */
        font-size: 16px !important; /* Évite le zoom auto forcé sur smartphone */
    }
    button {
        padding: 14px !important; /* Bouton d'action principal plus épais au doigt */
        font-size: 15px !important;
    }
}
</style>
</head>
<body>
<div class="login-container">
    <form action="/connexion" method="POST">
        <h2>Connexion</h2>
        
        <!-- Zone de notifications Flask -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <label for="NomUtilisateur">Nom d'utilisateur :</label>
        <input type="text" id="NomUtilisateur" name="NomUtilisateur" required>
        
        <label for="MotPasse">Mot de passe :</label>
        <input type="password" id="MotPasse" name="MotPasse" required>
        
        <button type="submit">Se connecter</button>
        <p style="text-align: center; margin-top: 15px;"><a href="/inscription">Créer un compte</a></p>
    </form>
</div>
</body>
</html>
