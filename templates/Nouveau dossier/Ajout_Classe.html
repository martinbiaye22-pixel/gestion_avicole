<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Ajout d'une Classe</title>
<style>
body { font-family: Arial, sans-serif; margin: 30px; background-color: #f4f4f9; }
.wrapper-centrage { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
.container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.form-group { margin-bottom: 20px; }
.form-group label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
input[type="text"], input[type="number"] { padding: 10px; width: 100%; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; display: block; }
.btn-green { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
.btn-green:hover { background-color: #218838; }
.btn-secondary { padding: 10px 15px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin-right: 10px; }
.btn-secondary:hover { background-color: #5a6268; }
.badge-code { background-color: #1e2229; color: #28a745; padding: 4px 8px; border-radius: 4px; font-size: 14px; font-weight: bold; display: inline-block; min-width: 100px; text-align: center; }
.actions-row { display: flex; justify-content: flex-end; margin-top: 25px; }
.info-text { font-size: 12px; color: #666; margin-top: 4px; }
</style>
</head>
<body>
<div class="wrapper-centrage">
<div class="container">
<h2>📝 Ajout d'une nouvelle Classe</h2>
<p style="margin-bottom: 25px;">Code généré : <span id="preview-code" class="badge-code">En attente...</span></p>

<form action="/classe/ajouter" method="POST">
    <div class="form-group">
        <label>Nom de la Classe :</label>
        <input type="text" id="NomClasse" name="NomClasse" placeholder="Ex: 6A" required autocomplete="off">
    </div>
    <div class="form-group">
        <label>Montant Inscription (FCFA) :</label>
        <input type="number" step="0.01" name="Montant" placeholder="Ex: 50000" required>
    </div>
    <div class="form-group">
        <label>Mensualité (FCFA) :</label>
        <input type="number" step="0.01" name="Mensualite" placeholder="Ex: 25000" required>
    </div>
    <div class="form-group">
        <label>Année Scolaire :</label>
        <input type="text" id="AnneeScolaire" name="AnneeScolaire" placeholder="Ex: 2026-2027" required autocomplete="off">
        <p class="info-text">Le système vérifiera l'existence de ce code pour cette année académique.</p>
    </div>
    <div class="actions-row">
        <a href="/classes" class="btn-secondary">Annuler</a>
        <button type="submit" class="btn-green">Ajouter la classe</button>
    </div>
</form>
</div>
</div>

<script>
// Script pour générer dynamiquement l'aperçu du code dans le badge
const nomInput = document.getElementById('NomClasse');
const anneeInput = document.getElementById('AnneeScolaire');
const previewBadge = document.getElementById('preview-code');

function updateCodePreview() {
    const nom = nomInput.value.trim();
    const annee = anneeInput.value.trim();
    
    if (nom && annee) {
        previewBadge.textContent = `${nom}-${annee}`;
    } else {
        previewBadge.textContent = "En attente...";
    }
}

nomInput.addEventListener('input', updateCodePreview);
anneeInput.addEventListener('input', updateCodePreview);
</script>
</body>
</html>
